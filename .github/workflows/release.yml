# Push a tag to release: git tag v0.1.0 && git push origin v0.1.0
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make test
      - run: make bin VERSION=${{ github.ref_name }}
      - run: gh release create "${{ github.ref_name }}" bin/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
